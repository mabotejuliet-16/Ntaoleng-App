<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
 
<title>Ntaoleng App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Boldonse&family=Cossette+Texte:wght@400;700&family=Oswald:wght@200..700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/axios@1.13.2/dist/axios.min.js"></script>    
<link rel="stylesheet" href="style.css">
  </head>
  <body>
    
    <header>Welcome to Ntaoleng`s weather App!</header>
    <main>
        
      
        <form class="search-form" id="search-form">
            <input
            type="search"
            placeholder="Enter a city.."
            required class="form-input" id="form-input"/>
             <input type="submit" value="Search" class="form-button"/>
        </form>
        <div class="box">
        <h1 id="app-city">
            
        </h1>
            
           <div id="time"> 
           <span class="day"> Today
           </span> 23:12,
           </div>
           <br/>
           <span id="weather-description"> </span>
             
            Humidity:<strong id="humidity"></strong>, Wind: <strong id="wind"></strong>
            
            <div class="temperature-container">
              <span class="temp-emoji"></span> 
              <span class="temp-value"></span>
              <span class="temp-unit">°C</span> 
            </div> 
        <div class="weather-forecast">
          <ul id="weather-forecast">

          </ul>

        </div>

    </main>
    <footer>
        Coded by <a href="https://github.com/mabotejuliet-16" target="_blank">Ntaoleng.J Mabote</a> and is
          <a href="https://github.com/mabotejuliet-16/Ntaoleng-App" target="_blank"> on GitHub</a> and
          <a href="https://app.netlify.com/teams/mabotejuliet" target="_blank">hosted on Netlify</a>
    </footer>
</div>
   

    <script src="script.js"></script>

  </body>
</html>
